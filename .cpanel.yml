---
deployment:
  tasks:
    # La aplicacion completa queda fuera de public_html.
    - export DEPLOYPATH="${HOME}/apps/bitacora-mw"
    # Ajusta estas rutas si el proveedor usa otros binarios de cPanel.
    - export PHP_BIN="${CPANEL_PHP_BIN:-/usr/local/bin/ea-php84}"
    - export COMPOSER_BIN="${CPANEL_COMPOSER_BIN:-/opt/cpanel/composer/bin/composer}"
    - export RSYNC_BIN="${CPANEL_RSYNC_BIN:-/usr/bin/rsync}"

    # Validar herramientas y secretos antes de modificar produccion.
    - /usr/bin/test -x "$PHP_BIN"
    - /usr/bin/test -r "$COMPOSER_BIN"
    - /usr/bin/test -x "$RSYNC_BIN"
    - /usr/bin/test -r "$DEPLOYPATH/.env"

    # Crear estructura persistente.
    - /bin/mkdir -p "$DEPLOYPATH/public" "$DEPLOYPATH/database" "$DEPLOYPATH/scripts" "$DEPLOYPATH/storage/bitacoras_pdf" "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/public/uploads/preventivos" "$DEPLOYPATH/public/uploads/correctivos" "$DEPLOYPATH/public/uploads/locativos/preventivos" "$DEPLOYPATH/public/uploads/locativos/correctivos"

    # Preparar y auditar dependencias antes de publicar el nuevo codigo.
    - /bin/cp composer.json "$DEPLOYPATH/composer.json"
    - /bin/cp composer.lock "$DEPLOYPATH/composer.lock"
    - >-
      "$PHP_BIN" "$COMPOSER_BIN" validate --strict --working-dir="$DEPLOYPATH"
    - >-
      "$PHP_BIN" "$COMPOSER_BIN" install --working-dir="$DEPLOYPATH" --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts
    - >-
      "$PHP_BIN" "$COMPOSER_BIN" audit --locked --working-dir="$DEPLOYPATH"

    # public/. incluye archivos ocultos como public/.htaccess.
    # uploads/ y .well-known/ son persistentes y no se eliminan.
    - >-
      "$RSYNC_BIN" -a --delete --exclude='uploads/' --exclude='.well-known/' public/ "$DEPLOYPATH/public/"
    - >-
      "$RSYNC_BIN" -a --delete database/ "$DEPLOYPATH/database/"
    - >-
      "$RSYNC_BIN" -a --delete scripts/ "$DEPLOYPATH/scripts/"

    # Proteger secretos y directorios escribibles.
    - /bin/chmod 600 "$DEPLOYPATH/.env"
    - /bin/chmod -R u+rwX "$DEPLOYPATH/storage"
    - /bin/chmod -R u+rwX "$DEPLOYPATH/public/uploads"

    # Actualizar esquema e importar la configuracion administrada por BD.
    - >-
      "$PHP_BIN" "$DEPLOYPATH/database/migrate.php"
    - >-
      "$PHP_BIN" "$DEPLOYPATH/scripts/import_bitacora_recipients.php"
